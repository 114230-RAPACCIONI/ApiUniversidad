<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center">Iniciar Sesión</h3>
        </div>
        <div class="card-body">
          <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
            @if (errorMessage) {
              <div class="alert alert-danger" role="alert">
                {{ errorMessage }}
              </div>
            }
            
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                [(ngModel)]="loginData.email"
                required
                #email="ngModel"
              />
              @if (email.invalid && email.touched) {
                <div class="text-danger">El email es requerido</div>
              }
            </div>

            <div class="mb-3">
              <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
              <input
                type="text"
                class="form-control"
                id="nombreUsuario"
                name="nombreUsuario"
                [(ngModel)]="loginData.nombreUsuario"
                required
                #nombreUsuario="ngModel"
              />
              @if (nombreUsuario.invalid && nombreUsuario.touched) {
                <div class="text-danger">El nombre de usuario es requerido</div>
              }
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
              Iniciar Sesión
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
